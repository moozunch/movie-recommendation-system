name: CI/CD Pipeline 

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jadi kan ini CI/CD, kali ini untuk automation testing, supaya kalau di push dia otomatis check dulu ada nggak bug
# Kapan robot ini bekerja?
# Setiap kali ada 'push' ke branch 'main' atau 'master'
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # Misi 1: Testing Backend
  test-backend:
    runs-on: ubuntu-latest # Robotnya pakai OS Ubuntu
    timeout-minutes: 20

    steps:
    # 1. Ambil kodingan kamu dari repo
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Create dummy .env file
      run: echo "TMDB_TOKEN=token_palsu_buat_testing" > backend/.env

    # 2. Setup Docker di dalam robot GitHub
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # 3. Nyalakan Docker Compose 
    - name: Build and Run Docker
      run: docker compose up -d --build

    # 4. Tunggu sebentar biar server nyala sempurna 
    - name: Sleep for 10 seconds
      run: sleep 10

    # 5. Jalankan Pytest 
    - name: Run Backend Tests
      run: docker compose exec -T backend pytest
    
    # 6. Matikan Docker setelah selesai
    - name: Tear down
      run: docker compose down

  # Misi 2: Testing Frontend (Unit - Vitest)
  test-frontend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests (Vitest)
        working-directory: frontend
        env:
          CI: true
        run: npm test -- --coverage --run

  # Aggregator job to depend on all checks
  all-checks:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend-unit]
    steps:
      - name: All unit tests passed
        run: echo "Backend + Frontend unit tests succeeded"